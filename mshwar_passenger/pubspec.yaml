name: mshwar_passenger
description: "مشوار - تطبيق الراكب"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ====== State Management ======
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ====== Navigation ======
  go_router: ^14.2.7

  # ====== Network ======
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ====== Local Storage ======
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # ====== Fonts & UI ======
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # ====== Animations ======
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # ====== OTP Input ======
  pinput: ^5.0.0

  # ====== Image ======
  image_picker: ^1.1.2

  # ====== Permissions & Location ======
  permission_handler: ^11.3.1
  geolocator: ^13.0.1

  # ====== Utils ======
  intl: ^0.19.0
  url_launcher: ^6.3.0
  mapbox_maps_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
