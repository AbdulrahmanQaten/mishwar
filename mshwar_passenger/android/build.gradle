allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Fallback properties for plugins that fail to read them from the Flutter extension
rootProject.ext {
    compileSdkVersion = 35
    targetSdkVersion = 35
    minSdkVersion = 21
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
