name: Build Driver AAB

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mshwar_driver/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'mshwar_driver/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get Dependencies
        run: |
          cd mshwar_driver
          flutter pub get

      - name: Create local.properties
        run: |
          cd mshwar_driver/android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> local.properties
          echo "flutter.compileSdkVersion=35" >> local.properties
          echo "flutter.targetSdkVersion=35" >> local.properties
          echo "flutter.minSdkVersion=21" >> local.properties
          echo "flutter.compileSdkVersion=35" >> gradle.properties
          echo "flutter.targetSdkVersion=35" >> gradle.properties
          echo "flutter.minSdkVersion=21" >> gradle.properties

      - name: Build App Bundle
        run: |
          cd mshwar_driver
          flutter build appbundle --release
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: driver-aab
          path: mshwar_driver/build/app/outputs/bundle/release/app-release.aab
