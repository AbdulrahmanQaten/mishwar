allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// THE FIX: Manually inject the 'flutter' object into all subprojects
// This satisfies plugins like geolocator that look for flutter.compileSdkVersion
subprojects {
    ext.flutter = [
        compileSdkVersion: 35,
        targetSdkVersion: 35,
        minSdkVersion: 21
    ]
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
